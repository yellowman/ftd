# /etc/ftd.conf — ftd configuration.
#
# Postfix-style: lowercase "key = value", one per line. Blank lines and
# #-comments are ignored; values may be quoted. Environment variables with the
# same name in uppercase override these settings. Every option is shown below,
# commented out, with its default or an example value.

# --- database (required) -----------------------------------------------------

# PostgreSQL connection string. Add ?sslmode=disable for a local non-TLS
# server; use sslmode=require or verify-full for remote databases.
#database_url = postgres://ftd:password@localhost/ftd?sslmode=disable

# --- listeners and paths -----------------------------------------------------

# Unix socket for the FastCGI listener (ignored when the daemon is started
# with -tcp <port>).
#fastcgi_socket = /var/www/run/ftd.sock

# User and group that own the FastCGI socket. While still root, ftd chowns
# the socket to <user>:<group> and sets mode 0660 so the web server can
# connect (write permission is required to connect to a unix socket). Use
# www-data on Debian-style Linux. If neither name resolves, the socket falls
# back to mode 0666 with the socket directory's permissions gating access.
#socket_user = www
#socket_group = www

# Public form submission endpoint.
#form_path = /form

# Admin dashboard path prefix.
#admin_prefix = /form/admin

# Public tracking endpoints prefix (open pixel, click redirect, unsubscribe,
# mailing images).
#track_path = /form/t

# --- sessions ----------------------------------------------------------------

# Signs admin session cookies. If unset, a random per-process key is generated
# and all sessions reset on restart. Set a long random string.
#session_secret = change-this-to-a-long-random-string

# Set (to any value) to drop the Secure cookie flag. Plain-HTTP development
# only; never in production.
#session_cookie_insecure = 1

# --- submissions -------------------------------------------------------------

# Maximum file upload size in megabytes; 0 disables uploads entirely.
#max_upload_mb = 0

# Submissions allowed per IP per rolling minute before a block. Size it above
# the number of forms a legitimate visitor might submit in one sitting.
#rate_limit_per_min = 8

# How long (minutes) an IP that exceeds the limit is blocked.
#rate_block_minutes = 60

# --- outgoing mail (mailings) ------------------------------------------------

# SMTP relay. Mailings cannot be sent until smtp_host and mail_from are set.
#smtp_host = 127.0.0.1
#smtp_port = 25

# Optional SMTP AUTH (PLAIN; STARTTLS is used when the relay offers it).
#smtp_user =
#smtp_pass =

# From address for outgoing mailings.
#mail_from = news@example.com

# Reply-To address on outgoing mailings. Point it at the mailbox your MTA
# routes back into ftd (reply_lmtp_socket below, or `ftd -deliver`) so
# customer replies appear as to-do submissions.
#reply_to = sales@example.com

# Public origin used to build open/click-tracking, unsubscribe, and mailing
# image URLs. Without it, mail goes out untracked with no unsubscribe link.
#public_base_url = https://example.com

# --- inbound replies ---------------------------------------------------------

# Unix socket for the inbound-reply LMTP listener; unset disables it. Route
# your reply_to address here from Postfix:
#   transport_maps:  sales@example.com  lmtp:unix:/var/www/run/ftd-lmtp.sock
#reply_lmtp_socket = /var/www/run/ftd-lmtp.sock

# User and group that own the LMTP socket (<user>:<group>, mode 0660) so the
# MTA's delivery agent can connect. This is a different daemon than the web
# server, so it gets its own owner: _postfix on OpenBSD, postfix on Linux.
# If neither name resolves, the socket falls back to mode 0666.
#reply_lmtp_user = _postfix
#reply_lmtp_group = _postfix
